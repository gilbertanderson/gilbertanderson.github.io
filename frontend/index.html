    />
    <style>
      html { background: #fafaf7; }
      html[data-mui-color-scheme='dark'] { background: #101113; }
    </style>
    <script>
      // Set light or dark before the app loads so the page never flashes the wrong theme.
      (function () {
        try {
          var saved = localStorage.getItem('ga-color-mode');
          var light = window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches;
          var dark = saved === 'dark' || (saved !== 'light' && !light);
          document.documentElement.setAttribute('data-mui-color-scheme', dark ? 'dark' : 'light');
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
