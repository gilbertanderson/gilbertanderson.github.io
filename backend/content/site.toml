# frontend/). The backend validates it against app/schemas.py, so a typo or a
# missing field fails the build with a clear message instead of a broken page.

[site]
name = "Gilbert Anderson"
title = "Making Life A Little Less Technically Difficult | AI/UI FDE"
headline = "I design interfaces and build the software behind them."
headline_highlights = ["interfaces", "software"]
# The bio. Separate paragraphs with a blank line; the first is shown larger. Leave empty to hide it.
bio = """
I'm a Forward Deployed Engineer and UI/UX & AI/Automation lead with 10+ years of experience building secure, data-driven applications for the U.S. Department of Defense and Intelligence Community.

I embed directly with mission customers, most recently on a U.S. Navy program at CACI, so I can turn analyst workflows into self-service tools where people search, filter, drill down, visualize, and securely export data without waiting on an engineer.

My strongest work is frontend and full-stack development with React, Angular, Vue, TypeScript, and REST/GraphQL, along with Grafana dashboards, and I also integrate LLMs and agentic tooling with Anthropic Claude, OpenAI GPT, and AWS Bedrock. I've used Docker and Kubernetes since 2016 and Podman more recently, and I'm a Certified ScrumMaster and Certified Scrum Professional who has worked as both a Scrum Master and a Scrum instructor. On top of that I bring general IT experience in cybersecurity, Linux, setting up AWS environments, and Tier 1 and Tier 2 support, and I hold an active TS/SCI clearance with CI polygraph.
"""
url = "https://gilbertanderson.com/"
accent = "#0B63CE"
accent_on_dark = "#6CB2FF"
resume = "/Gilbert_Anderson_Resume.docx"
resume_pdf = "/Gilbert_Anderson_Resume.pdf"
banner = "/profile/banner.svg"
avatar = "/profile/avatar.jpg"

