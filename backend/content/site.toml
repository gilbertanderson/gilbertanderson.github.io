# The bio. Separate paragraphs with a blank line; the first is shown larger. Leave empty to hide it.
bio = """
I'm a Forward Deployed Engineer and UI/UX & AI/Automation lead with 10+ years of experience building secure, data-driven applications for the U.S. Department of Defense and Intelligence Community.

I embed directly with mission customers, most recently inside a federal Office of Inspector General, and turn analyst workflows into self-service platforms where users can search, filter, drill down, visualize, and securely export data without needing engineering support.

My strongest work is in frontend and full-stack development with React, Angular, Vue, TypeScript, and REST/GraphQL, alongside Tableau, Grafana, and Kibana, and I also have hands-on experience integrating LLMs and agentic tooling with Anthropic Claude, OpenAI GPT, and AWS Bedrock. I am a Certified ScrumMaster and Certified Scrum Professional with Agile Scrum experience as a Scrum Master and Scrum instructor. I hold an active TS/SCI clearance with CI polygraph.
"""
